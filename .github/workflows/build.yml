name: build-apk

on:
  workflow_call:
    inputs:
      tg_ref:
        description: "DrKLO/Telegram ref (commit SHA or tag) to build; empty = pinned TG_COMMIT"
        type: string
        required: false
        default: ""
      all_abis:
        description: "Build all ABIs (universal APK) instead of arm64-only"
        type: boolean
        default: false
      do_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: false
      release_tag:
        description: "Tag to publish under when do_release is set (ignored on tag pushes)"
        type: string
        required: false
        default: ""
      release_name:
        description: "Human title for that release"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      all_abis:
        description: "Build all ABIs (universal APK) instead of arm64-only"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # DrKLO/Telegram commit to build against; patch verified to apply cleanly here
  TG_COMMIT: 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c   # 12.10.1 (7038)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Resolve upstream ref
        id: ref
        run: |
          REF="${{ inputs.tg_ref }}"
          if [ -z "$REF" ]; then REF="$TG_COMMIT"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building against DrKLO/Telegram @ $REF"

      - name: Clone DrKLO/Telegram @ ref
        run: |
          git init Telegram
          cd Telegram
          git remote add origin https://github.com/DrKLO/Telegram.git
          git -c protocol.version=2 fetch --depth 1 origin "${{ steps.ref.outputs.ref }}"
          git checkout --detach FETCH_HEAD
          # Upstream moved libvpx, dav1d and ffmpeg out of the tree and into
          # submodules (DrKLO commit c4be29c1, ~390k lines deleted). Without
          # this those directories are simply empty, and the build does not
          # fail loudly - it produces an APK several megabytes short of a real
          # one. A shallow submodule fetch only reaches branch tips, so fall
          # back to a full one when the pinned commit is older than that.
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive --depth 1 \
              || git submodule update --init --recursive
            for d in libvpx dav1d ffmpeg; do
              p="TMessagesProj/jni/third_party/$d"
              if [ -d "$p" ] && [ -z "$(ls -A "$p")" ]; then
                echo "error: submodule $d is still empty after init" >&2
                exit 1
              fi
            done
          fi

      - name: Apply custom-endpoint patch
        run: bash custom/client/apply.sh "$PWD/Telegram"

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > Telegram/TMessagesProj/config/release.keystore
            # Keep building the 'afat debug' variant (retains the .beta suffix and skips
            # R8/minify so the patch's classes are never stripped) but make it a proper
            # release: non-debuggable + signed with the custom keystore below.
            sed -i -e 's/debuggable true/debuggable false/g' \
                   -e 's/jniDebuggable true/jniDebuggable false/g' \
              Telegram/TMessagesProj_App/build.gradle
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo ">> release signing ON (non-debuggable, custom keystore)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo ">> no SIGNING_KEYSTORE_BASE64 secret -> debug-signed, debuggable build"
          fi

      - name: Limit to arm64-v8a (faster)
        if: ${{ !inputs.all_abis }}
        run: |
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' \
            Telegram/TMessagesProj_App/build.gradle

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > Telegram/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Telegram/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build APK
        env:
          SP: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KP: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KA: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          cd Telegram
          chmod +x gradlew
          # Only override the signing props when a keystore secret was provided; otherwise
          # gradle.properties defaults (DrKLO's checked-in debug key) apply. Passed via
          # ORG_GRADLE_PROJECT_* env (not -P) so passwords never hit the process args.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            export ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD="$SP"
            export ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD="$KP"
            export ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS="$KA"
          fi
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk tg-custom-endpoint.apk
          sha256sum tg-custom-endpoint.apk | tee tg-custom-endpoint.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-custom-endpoint-apk
          path: |
            tg-custom-endpoint.apk
            tg-custom-endpoint.apk.sha256

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push the action uses the pushed tag. When the watcher calls
          # us it supplies its own tag, so an upstream change lands somewhere
          # downloadable instead of only in a run artifact that expires.
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          # Automated builds are prereleases: they are visible and downloadable
          # but do not displace the curated v* release as "Latest".
          prerelease: ${{ inputs.do_release && !startsWith(github.ref, 'refs/tags/') }}
          files: |
            tg-custom-endpoint.apk
            tg-custom-endpoint.apk.sha256
          body: |
            Custom-endpoint Telegram for Android — automated build.

            Installs alongside the official app as `org.telegram.messenger.beta`.
            Signed with the project key when the repository has the signing
            secrets, debug-signed otherwise — check the APK's certificate
            digest if it matters to you.

            First launch asks for one thing: the setup code your relay operator
            gave you (`host|TOKEN|CHECK`), or just a hostname if you run your
            own relay. It then creates the `api_id` / `api_hash` for your own
            account by signing in to my.telegram.org through that relay, so
            nothing has to be looked up by hand. That site sends its
            confirmation code as a Telegram message rather than an SMS, so you
            need Telegram reachable somewhere once; entering keys manually
            stays available if you would rather.

            Built from DrKLO/Telegram @ ${{ steps.ref.outputs.ref }}.
